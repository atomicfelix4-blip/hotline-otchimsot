<script>

const CH=[{n:'KHÁNH',d:'Chạy rất nhanh, chịu được 2 phát mới chết',sp:215,hp:2,col:'#39d353',h:'dog',e:'🐶'},{n:'LONG',d:'Luôn đạp cửa, nhưng chạy chậm',sp:115,hp:1,kick:1,col:'#ffd23f',h:'sloth',e:'🦥'},{n:'QUÂN',d:'Cân bằng, mọi thứ bình thường',sp:165,hp:1,col:'#6aa8ff',h:'cow',e:'🐮'},{n:'THẮNG',d:'Nhát gan, chỉ đi sau lưng bạn, không đánh, không mở cửa. Đổi lại bạn chạy nhanh, bắn nhanh và tự đạp cửa',sp:200,hp:1,cow:1,buff:1,col:'#e0a3ff',h:'pig',e:'🐷'}];
let sel=2,picks=[2],multi=0,allies=[],BF=0;
let mi=0;
const MAPS=[
{n:'KHO HÀNG',c:'#ff2a6d',w:MW,h:MH,sx:SX,sy:SY,walls:walls,doors:[[340,240],[340,480],[660,180],[660,500]],sp:SP},
{n:'KHÁCH SẠN',c:'#b967ff',w:1000,h:900,sx:500,sy:840,

 doors:[[420,120],[420,430],[420,730],[560,160],[560,380],[560,700]],
 sp:[[110,90],[320,100],[200,230],[90,380],[330,400],[200,540],[110,680],[330,700],[220,820],[660,90],[880,110],[760,240],[660,400],[900,380],[780,550],[680,700],[900,720],[790,830],[500,500],[500,200],[500,650]]},
{n:'XƯỞNG',c:'#39ff14',w:1100,h:700,sx:70,sy:70,
 walls:[[0,0,1100,20],[0,680,1100,20],[0,0,20,700],[1080,0,20,700],[300,20,20,100],[300,200,20,220],[300,500,20,180],[560,20,20,260],[560,360,20,180],[560,620,20,60],[820,20,20,80],[820,180,20,220],[820,480,20,200],[120,300,60,60],[420,120,60,60],[420,480,60,60],[680,300,60,60],[940,260,60,60],[940,500,60,60],[130,540,80,40]],
 doors:[[300,120],[560,280],[820,100],[820,400]],
 sp:[[220,420],[70,600],[240,620],[400,60],[440,300],[380,620],[500,440],[640,100],[700,420],[700,600],[760,200],[900,100],[1030,380],[900,420],[900,600],[1040,620],[640,500],[1000,160],[460,230]]},
{n:'TẦNG HẦM',c:'#2e9bff',w:1000,h:800,sx:60,sy:730,
 walls:[[0,0,1000,20],[0,780,1000,20],[0,0,20,800],[980,0,20,800],[250,100,20,300],[250,480,20,300],[500,20,20,280],[500,380,20,240],[500,700,20,80],[750,100,20,260],[750,440,20,340],[100,450,70,40],[360,150,60,60],[360,560,60,60],[620,250,60,60],[620,520,70,40],[860,300,60,60],[860,600,60,60]],
 doors:[[250,20],[250,400],[500,620],[750,20],[750,360]],
 sp:[[150,120],[100,330],[200,500],[330,80],[420,330],[330,700],[440,480],[350,450],[600,100],[700,380],[600,680],[660,450],[700,160],[880,100],[900,450],[840,700],[930,220],[900,550]]}
];
function setMap(i){
  const m=MAPS[i];mi=i;MW=m.w;MH=m.h;SX=m.sx;SY=m.sy;walls=m.walls;
  doors=m.doors.map(a=>({x:a[0],y:a[1],w:20,h:80,s:0,a:0,k:0,dir:1}));
  SP=m.sp.filter(s=>Math.hypot(s[0]-SX,s[1]-SY)>230);
}
function newMap(){let i;do{i=Math.random()*MAPS.length|0}while(i===mi&&MAPS.length>1);setMap(i)}
let W,H,S,dpr,R;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;S=Math.max(.8,Math.min(2,Math.min(W,H)/400));R=cv.getBoundingClientRect()}
addEventListener('resize',rs);rs();
addEventListener('contextmenu',e=>e.preventDefault());

const rnd=(a,b)=>a+Math.random()*(b-a);
const adiff=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
function hitW(x,y,r){for(const w of walls){const cx=Math.max(w[0],Math.min(x,w[0]+w[2])),cy=Math.max(w[1],Math.min(y,w[1]+w[3]));if((x-cx)**2+(y-cy)**2<r*r)return 1}for(const d of doors){if(d.s)continue;const cx=Math.max(d.x,Math.min(x,d.x+d.w)),cy=Math.max(d.y,Math.min(y,d.y+d.h));if((x-cx)**2+(y-cy)**2<r*r)return 1}return 0}
function mv(e,dx,dy){e.x+=dx;if(hitW(e.x,e.y,e.r))e.x-=dx;e.y+=dy;if(hitW(e.x,e.y,e.r))e.y-=dy}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/8);for(let i=1;i<n;i++){const t=i/n;if(hitW(ax+(bx-ax)*t,ay+(by-ay)*t,1))return 0}return 1}

let st='title',tt=0,t=0,lvl=1,score=0,base=0,combo=0,ct=0,shake=0,clear=0,camx=SX,camy=SY;
let p,ally=null,en=[],bu=[],dr=[],blood=[];
function show(h){if(h.indexOf('NEON MIAMI')>-1||h==='@pick')h=titleHTML();const m=$('msg');document.body.classList.toggle('np',!!h);m.innerHTML=h;m.style.display=h?'flex':'none'}

const WP={pistol:{n:'SÚNG LỤC',a:6,cd:.22,sp:680,pel:1,spr:0,l:1},shotgun:{n:'HOA CÀI',a:5,cd:.7,sp:600,pel:6,spr:.35,l:.35},smg:{n:'SMG',a:24,cd:.09,sp:700,pel:1,spr:.12,l:1},katana:{n:'KATANA',a:0,m:1,rng:54,arc:1.9,cd:.28}};
function spawnE(pts,t,hp){
  for(let k=0;k<14;k++){
    const q=pts[Math.random()*pts.length|0],x=q[0]+rnd(-40,40),y=q[1]+rnd(-40,40);
    if(hitW(x,y,14)||Math.hypot(x-SX,y-SY)<230)continue;
    en.push({x,y,r:t===4?10:9,a:rnd(0,6.28),t,hp,fl:0,st:0,lost:0,lx:x,ly:y,cd:rnd(.3,1),wind:0,wt:0,wa:0,mvg:0,dead:0});return;
  }
}
function load(){
  p={x:SX,y:SY,r:9,a:-.8,cd:0,sw:0,ammo:0,w:null,near:null,dead:0};
  doors.forEach(d=>{d.s=0;d.a=0;d.k=0;d.dir=1});allies=picks.map((ci,i)=>({ci,x:SX,y:SY,r:9,a:-.8,cd:1,sw:0,dead:0,rt:0,st:0,hp:CH[ci].hp,inv:0,off:i*1.6+.8}));allies.forEach(a=>tpAlly(a));BF=picks.some(i=>CH[i].buff)?1:0;en=[];bu=[];dr=[];blood=[];combo=0;ct=0;score=base;clear=0;camx=p.x;camy=p.y;
  const pts=[...SP].sort(()=>Math.random()-.5),n=Math.min(3+lvl*2,pts.length-5),gf=Math.min(.7,.25+lvl*.1);
  for(let i=0;i<n;i++){const[x,y]=pts[i];en.push({x,y,r:9,a:rnd(0,6.28),t:Math.random()<gf?1:0,hp:2+(lvl>=4?1:0),fl:0,st:0,lost:0,lx:x,ly:y,cd:rnd(.3,1),wind:0,wt:0,wa:0,mvg:0,dead:0})}
  {const q=pts[n];en.push({x:q[0],y:q[1],r:12,a:rnd(0,6.28),t:2,hp:5+(lvl/3|0),fl:0,st:0,lost:0,lx:q[0],ly:q[1],cd:1,wind:0,wt:0,wa:0,mvg:0,dead:0})}
  for(let k=3;k<5;k++){const q=pts[n+k];en.push({x:q[0],y:q[1],r:7,a:rnd(0,6.28),t:3,fl:0,st:0,lost:0,lx:q[0],ly:q[1],cd:1,wind:0,wt:0,wa:0,mvg:0,dead:0})}
  for(let k=0,ex=Math.min(2+lvl*2,16);k<ex;k++)spawnE(pts,Math.random()<gf?1:0,2+(lvl>=4?1:0));
  for(let k=0,cr=Math.min(1+(lvl>>1),4);k<cr;k++)spawnE(pts,4,3+(lvl>=5?1:0));
  for(let i=n+1;i<n+3;i++){const w=['shotgun','smg','katana','pistol'][Math.random()*4|0];dr.push({x:pts[i][0],y:pts[i][1],w,n:WP[w].a})}
  st='play';tt=0;show('');
}
function begin(){if(st==='title'){lvl=1;score=base=0;newMap()}load()}

function splat(x,y,n){for(let i=0;i<n;i++)blood.push({x:x+rnd(-12,12),y:y+rnd(-12,12),r:rnd(2,6)});if(blood.length>350)blood.splice(0,n)}
function earD(x,y,r){for(const e of en)if(!e.dead&&e.t===3&&Math.hypot(e.x-x,e.y-y)<r*2.4){if(!e.st)snd('bark',1,e.x,e.y);e.st=1;e.lost=5;e.lx=x;e.ly=y}}
function hurt(e,d){
  if(!e.hp){kill(e);return}
  e.hp-=d;e.fl=.12;e.st=1;e.lost=4;e.lx=p.x;e.ly=p.y;splat(e.x,e.y,3);shake=4;
  if(e.hp<=0)kill(e);else snd('hit',.6,e.x,e.y);
}
function kill(e){snd('hit',1,e.x,e.y);e.dead=1;combo++;ct=3;score+=100*combo+(e.t===2?500:e.t===4?150:0);shake=6;splat(e.x,e.y,9);if(e.t&&e.t!==3&&(e.t===2||e.t===4||Math.random()<.8)){const w=(e.t===2||e.t===4)?['shotgun','smg'][Math.random()*2|0]:['pistol','pistol','shotgun','smg'][Math.random()*4|0];dr.push({x:e.x,y:e.y,w,n:WP[w].a})}else if(!e.t&&Math.random()<.2)dr.push({x:e.x,y:e.y,w:'katana',n:0})}
function die(){if(p.dead)return;p.dead=1;snd('death');shake=12;splat(p.x,p.y,14);st='dead';tt=0;show('<h1>BẠN ĐÃ CHẾT</h1><p>Chạm hoặc nhấn R để thử lại tầng này</p>');try{navigator.vibrate&&navigator.vibrate(120)}catch(_){}}

// audio (tổng hợp bằng WebAudio, không dùng file ngoài)
let AC=null,nbuf,mst,musb,mute=0,nt=0,step=0;
function ac(){
  if(!AC){try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const cp=AC.createDynamicsCompressor();mst=AC.createGain();mst.gain.value=.8;mst.connect(cp);cp.connect(AC.destination);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;musb=AC.createGain();musb.gain.value=.3;musb.connect(lp);lp.connect(mst);
  }catch(_){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
addEventListener('touchend',ac);addEventListener('click',ac);
function tglMute(){mute=!mute;$('snd').textContent=mute?'🔇':'🔊'}
function tone(type,f0,f1,dur,vol,at,bus){const o=AC.createOscillator(),gn=AC.createGain();at=at||AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,at);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),at+dur);gn.gain.setValueAtTime(vol,at);gn.gain.exponentialRampToValueAtTime(.001,at+dur);o.connect(gn);gn.connect(bus||mst);o.start(at);o.stop(at+dur+.02)}
function noise(dur,f0,f1,vol,type,at,bus){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();at=at||AC.currentTime;s.buffer=nbuf;f.type=type||'lowpass';f.frequency.setValueAtTime(f0,at);f.frequency.exponentialRampToValueAtTime(Math.max(f1,20),at+dur);gn.gain.setValueAtTime(vol,at);gn.gain.exponentialRampToValueAtTime(.001,at+dur);s.connect(f);f.connect(gn);gn.connect(bus||mst);s.start(at,Math.random()*.8);s.stop(at+dur+.02)}
function snd(k,v,x,y){
  if(!AC||mute)return;v=v===undefined?1:v;
  if(x!==undefined)v*=Math.max(0,1-Math.hypot(x-p.x,y-p.y)/450);
  if(v<.04)return;
  const n=AC.currentTime;
  switch(k){
  case'pistol':noise(.16,2200,250,.6*v,'bandpass');tone('square',260,45,.14,.4*v);break;
  case'shotgun':noise(.5,3500,120,1*v,'lowpass');tone('sawtooth',130,30,.35,.8*v);break;
  case'smg':noise(.09,2800,500,.4*v,'bandpass');tone('square',320,80,.07,.28*v);break;
  case'enemy':noise(.2,1500,200,.5*v,'lowpass');tone('sawtooth',180,40,.15,.35*v);break;
  case'swing':noise(.14,500,2200,.3*v,'bandpass');break;
  case'katana':noise(.18,1500,5000,.3*v,'bandpass');tone('sine',2400,900,.18,.08*v);break;
  case'hit':tone('sine',160,35,.22,.9*v);noise(.12,1400,150,.6*v,'lowpass');noise(.22,400,90,.4*v,'bandpass',n+.03);break;
  case'death':tone('sawtooth',110,22,1.1,.6*v);tone('sine',60,30,1,.8*v);noise(.8,900,80,.7*v,'lowpass');tone('sine',1000,1000,.7,.07*v,n+.35);break;
  case'throw':noise(.15,400,1800,.25*v,'bandpass');break;
  case'pick':tone('square',700,900,.05,.15*v);tone('square',1000,1400,.06,.15*v,n+.06);break;
  case'alert':tone('square',500,1000,.1,.18*v);break;
  case'bark':tone('sawtooth',500,250,.12,.4*v);tone('square',380,200,.1,.25*v,n+.14);noise(.1,1500,500,.3*v,'bandpass');break;
  case'door':noise(.12,300,120,.4*v,'lowpass');tone('sine',90,60,.1,.3*v);break;
  case'kick':tone('sine',130,28,.3,1*v);noise(.25,2500,150,.9*v,'bandpass');noise(.3,300,80,.6*v,'lowpass');break;
  case'clear':[392,494,587,784].forEach((f,i)=>tone('triangle',f,f,.28,.25*v,n+i*.09));break;
  }
}
const BASS=[110,0,110,110,0,130.8,0,110,98,0,98,98,0,116.5,0,98],ARP=[220,262,330,262,220,262,392,330,196,247,294,247,196,247,349,294],ROOT=[1,.794,.891,.749];
function musTick(){
  if(!AC||mute||st!=='play'||AC.state!=='running'){nt=0;return}
  if(nt<AC.currentTime)nt=AC.currentTime+.05;
  const sp=60/132/4;
  while(nt<AC.currentTime+.25){
    const s=step%16,r=ROOT[(step>>4)&3];
    if(s%4===0)tone('sine',160,38,.2,.9,nt,musb);
    if(s===4||s===12)noise(.16,3200,900,.5,'bandpass',nt,musb);
    if(s%2===1)noise(.04,9000,7000,.18,'highpass',nt,musb);
    if(BASS[s])tone('sawtooth',BASS[s]*r,BASS[s]*r*.98,sp*1.7,.45,nt,musb);
    if(s%2===0)tone('square',ARP[s]*r,ARP[s]*r,sp*1.2,.07,nt,musb);
    nt+=sp;step++;
  }
}

function ent(x,y,a,col,w){

  g.fillStyle=col;g.beginPath();g.arc(0,0,9,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(2,0,5,0,7);g.fill();
  g.strokeStyle=w[0];g.lineWidth=w[1];g.beginPath();g.moveTo(6,6);g.lineTo(6+w[2],6);g.stroke();
  g.restore();
}

  }
  for(const b of bu){if(b.n!==undefined){g.save();g.translate(b.x,b.y);g.rotate(t*25);g.fillStyle='#ddd';g.fillRect(-6,-3,12,6);g.restore();continue}g.fillStyle=b.o?'#fff':'#ffd300';g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill()}

      ent(a.x,a.y,a.a,a.inv>0&&((t*20|0)%2)?'#fff':cs.col,['#ddd',3,12]);if(cs.h)head(a.x,a.y,a.a,cs.h,a.inv>0&&((t*20|0)%2)?.5:1);g.fillStyle=cs.col;g.font='bold 9px system-ui';g.fillText(cs.n,a.x-16,a.y-14)}
